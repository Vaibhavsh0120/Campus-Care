name: App Release
run-name: Release Campus Care ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (vMAJOR.MINOR.PATCH)'
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: app-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tag must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          }

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure public app credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY secret}"
          : "${RAZORPAY_KEY_ID:?Missing RAZORPAY_KEY_ID secret}"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nRAZORPAY_KEY_ID=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$RAZORPAY_KEY_ID" > .env

      - run: flutter pub get

      - name: Build Android APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --build-name "${RELEASE_TAG#v}" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Campus-Care-${RELEASE_TAG}.apk"

      - name: Build unsigned iOS IPA
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter build ios --release --no-codesign --build-name "${RELEASE_TAG#v}" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qry "Campus-Care-${RELEASE_TAG}-unsigned.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: campus-care-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: campus-care-*
          merge-multiple: true
          path: dist

      - name: Publish APK, IPA, checksums, and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s "dist/Campus-Care-${RELEASE_TAG}.apk"
          test -s "dist/Campus-Care-${RELEASE_TAG}-unsigned.ipa"
          (cd dist && sha256sum *.apk *.ipa > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Campus Care ${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes
